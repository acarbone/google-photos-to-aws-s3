[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gphotos2s3"
version = "0.1.0"
description = "Back up a Google Photos Takeout export to your own low-cost AWS S3 bucket — resumable, idempotent, open source."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "gphotos2s3 contributors" }]
keywords = ["google-photos", "google-takeout", "aws-s3", "backup", "archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "boto3>=1.34",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "boto3-stubs[s3,sts]>=1.34",
]

[project.urls]
Homepage = "https://github.com/example/gphotos2s3"
Repository = "https://github.com/example/gphotos2s3"

[project.scripts]
gphotos2s3 = "gphotos2s3.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gphotos2s3"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv", "spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src/gphotos2s3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
